<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pieles Rodrigo Mori - Presentación</title>
  <style>
    /* Estilos generales y fondo */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0f12;
      color: #d4af37; /* Dorado elegante */
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      padding-top: 80px; /* Espacio para el header fijo */
    }

    /* Topbar y Encabezado */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(13, 15, 18, 0.95);
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      backdrop-filter: blur(5px);
      z-index: 500;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title h1 {
      font-size: 1.4rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      line-height: 1;
    }
    .brand-title p {
      font-size: 0.75rem;
      color: #ccc;
      letter-spacing: 1px;
    }

    /* Menú de acceso directo */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-item {
      color: #d4af37;
      text-decoration: none;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid transparent;
      transition: all 0.3s ease;
      cursor: pointer;
      background: none;
      font-family: inherit;
    }

    .nav-item:hover {
      border-color: #d4af37;
      background: rgba(212, 175, 55, 0.1);
    }

    .nav-item svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Botón reproducir pequeño */
    .play-btn-small {
      background: #d4af37;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.2s, background-color 0.2s;
    }
    .play-btn-small:hover {
      transform: scale(1.05);
      background: #f1c40f;
    }

    /* Contenedor principal para el grid de 4 videos */
    .video-container {
      position: relative;
      width: 90vw;
      max-width: 1000px;
      height: 70vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 15px;
      padding: 10px;
      margin-top: 10px;
    }

    /* Estilo de cada recuadro de video */
    .video-box {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 1;
      background: #000;
    }

    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Clase que se activa con JS para agrandar el video al centro */
    .video-box.active {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 80%;
      z-index: 100;
      border-color: #d4af37;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
    }

    /* Subtítulos en la parte inferior */
    .subtitles {
      position: absolute;
      bottom: 20px;
      width: 80%;
      max-width: 800px;
      text-align: center;
      font-size: 1.1rem;
      font-style: italic;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 20px;
      z-index: 200;
    }

    /* Ventana emergente (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-content {
  position: relative;
  width: 95%;
  max-width: 1100px; /* Más ancho para el libro */
  height: 92vh;       /* Más alto para abarcar las fotos completas */
  background: #0d0f12;
  border: 2px solid #d4af37;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 35px rgba(212, 175, 55, 0.4);
}

    .modal-close {
      position: absolute;
      top: 10px;
      right: 15px;
      background: #d4af37;
      color: #000;
      border: none;
      font-weight: bold;
      font-size: 1.2rem;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1001;
      line-height: 1;
    }

    .modal-content iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
	@media (max-width: 768px) {
  header {
    flex-direction: column;
    gap: 8px;
    padding: 8px 10px;
  }

  .nav-links {
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
  }

  .nav-item {
    font-size: 0.75rem;
    padding: 4px 8px;
  }

  body {
    padding-top: 110px; /* Otorga más margen debido al header de dos filas */
  }

  .video-container {
    height: 60vh;
  }
}
footer a,
footer a:visited,
footer a:hover,
footer a:active {
    color: inherit;
    text-decoration: underline;
}

  </style>
</head>

  <script>
    const audio = document.getElementById('narrativeAudio');
    const startBtn = document.getElementById('startBtn');
    const subtitles = document.getElementById('subtitles');

    const boxes = [
      document.getElementById('box1'),
      document.getElementById('box2'),
      document.getElementById('box3'),
      document.getElementById('box4')
    ];

    const videos = [
      document.getElementById('v1'),
      document.getElementById('v2'),
      document.getElementById('v3'),
      document.getElementById('v4')
    ];

    const sequence = [
      {
        time: 0,
        boxIndex: -1,
        text: ""
      },
      {
        time: 4,
        boxIndex: 0,
        text: "Rodrigo Mori brings you the unexpected. We are reviving a way of creating fashion,"
      },
      {
        time: 11,
        boxIndex: 1,
        text: "putting our utmost effort into every creation, prioritizing quality and aesthetic detail in each one"
      },
      {
        time: 17,
        boxIndex: 2,
        text: "putting our utmost effort into every creation, prioritizing quality and aesthetic detail in each one, "
      },
      {
        time: 23,
        boxIndex: 3,
        text: " which have remained under a rigorous storage and care system."
      },
      {
        time: 29,
        boxIndex: -1,
        text: ""
      }
    ];

    let isPlaying = false;

    function startExperience() {
      if (isPlaying) return;
      
      // Iniciar videos en loop silenciados
      videos.forEach(v => v.play().catch(() => {}));

      // Intentar reproducir audio
      audio.play().then(() => {
        isPlaying = true;
        startBtn.innerHTML = "⏸ Pausar";
      }).catch(err => {
        // Bloqueo de Autoplay por el navegador
        console.warn("Autoplay bloqueado por el navegador. Se requiere clic del usuario.");
        subtitles.textContent = "Haz clic en ▶ Reproducir en el header para iniciar.";
      });
    }

    // Event listener del botón en la barra superior
    startBtn.addEventListener('click', () => {
      if (!isPlaying) {
        audio.play();
        videos.forEach(v => v.play());
        isPlaying = true;
        startBtn.innerHTML = "⏸ Pausar";
      } else {
        audio.pause();
        videos.forEach(v => v.pause());
        isPlaying = false;
        startBtn.innerHTML = "▶ Reproducir";
      }
    });

    // Control mediante el tiempo del audio
    audio.addEventListener('timeupdate', () => {
      const currentTime = audio.currentTime;

      let currentStep = sequence[0];
      for (let i = 0; i < sequence.length; i++) {
        if (currentTime >= sequence[i].time) {
          currentStep = sequence[i];
        }
      }

      subtitles.textContent = currentStep.text;

      boxes.forEach((box, index) => {
        if (index === currentStep.boxIndex) {
          box.classList.add('active');
        } else {
          box.classList.remove('active');
        }
      });
    });

    // Reiniciar al finalizar
    audio.addEventListener('ended', () => {
      boxes.forEach(b => b.classList.remove('active'));
      subtitles.textContent = "Pieles Rodrigo Mori - High Fashion";
      startBtn.innerHTML = "▶ Reproducir";
      isPlaying = false;
    });

    // Modales para emergentes
    function openModal(url) {
      document.getElementById('modalIframe').src = url;
      document.getElementById('modalOverlay').classList.add('open');
      
      // Pausar la presentación si la ventana emergente se abre
      if(isPlaying) {
        audio.pause();
        videos.forEach(v => v.pause());
        isPlaying = false;
        startBtn.innerHTML = "▶ Reproducir";
      }
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      document.getElementById('modalIframe').src = '';
    }

    // Autoejecución al ingresar por primera vez
    window.addEventListener('DOMContentLoaded', () => {
      startExperience();
    });
  </script>
